[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zomato-ai-recommender"
version = "0.1.0"
description = "Phase-wise AI-powered restaurant recommendation system"
readme = "Docs.md"
requires-python = ">=3.11"
dependencies = [
  "datasets",
  "pandas",
  "pyarrow",
  "pydantic",
  "pytest",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["src*"]

